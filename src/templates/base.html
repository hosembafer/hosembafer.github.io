<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R2VTLG8YJG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-R2VTLG8YJG');
    </script>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', savedTheme || preferredTheme);
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{metaDescription}}">
    <meta name="author" content="Rafayel Hovhannisyan">
    <meta name="robots" content="index, follow">
    <meta name="generator" content="Minimal static site generator">
    <meta name="color-scheme" content="light dark">
    <link rel="canonical" href="{{canonicalUrl}}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <title>{{pageTitle}}</title>
    <meta property="og:site_name" content="Rafayel Hovhannisyan">
    <meta property="og:type" content="{{ogType}}">
    <meta property="og:title" content="{{socialTitle}}">
    <meta property="og:description" content="{{metaDescription}}">
    <meta property="og:url" content="{{canonicalUrl}}">
    <!-- <meta property="og:image" content="{{socialImage}}"> -->
    <!-- <meta property="og:image:alt" content="{{socialImageAlt}}"> -->
    <meta name="twitter:card" content="{{twitterCard}}">
    <meta name="twitter:title" content="{{socialTitle}}">
    <meta name="twitter:description" content="{{metaDescription}}">
    <!-- <meta name="twitter:image" content="{{socialImage}}"> -->
{{extraMeta}}
    <script type="application/ld+json">
{{structuredData}}
    </script>
    <style>
{{styles}}
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">☽</button>
    <div class="container">
{{header}}
        <hr />
        <main>
{{content}}
        </main>
        <hr />
{{footer}}
    </div>
    <script>
        (function() {
            var root = document.documentElement;
            var toggle = document.getElementById('themeToggle');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
            var mermaidModulePromise;
            var emailAddress = document.getElementById('emailAddress');
            var copyBtn = document.getElementById('copyEmail');

            function currentTheme() {
                return root.getAttribute('data-theme') || 'light';
            }

            function syncToggleLabel(theme) {
                if (toggle) {
                    toggle.textContent = theme === 'dark' ? '☼' : '☽';
                }
            }

            function setTheme(theme) {
                root.setAttribute('data-theme', theme);
                syncToggleLabel(theme);
                localStorage.setItem('theme', theme);
                renderMermaid();
            }

            async function renderMermaid() {
                var diagrams = document.querySelectorAll('[data-mermaid-source]');
                if (!diagrams.length) {
                    return;
                }

                if (!mermaidModulePromise) {
                    mermaidModulePromise = import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
                }

                var mermaidLib = await mermaidModulePromise;
                var mermaid = mermaidLib.default;
                mermaid.initialize({
                    startOnLoad: false,
                    securityLevel: 'loose',
                    theme: currentTheme() === 'dark' ? 'dark' : 'default'
                });

                var index = 0;
                for (var diagram of diagrams) {
                    var source = decodeURIComponent(diagram.getAttribute('data-mermaid-source') || '');
                    try {
                        var result = await mermaid.render('diagram-' + index + '-' + currentTheme(), source);
                        diagram.innerHTML = result.svg;
                    } catch (error) {
                        var fallback = document.createElement('pre');
                        fallback.textContent = source;
                        diagram.replaceChildren(fallback);
                    }
                    index += 1;
                }
            }

            function copyEmail() {
                if (!emailAddress || !copyBtn || !navigator.clipboard) {
                    return;
                }

                var email = emailAddress.textContent;
                navigator.clipboard.writeText(email).then(function() {
                    var originalText = copyBtn.textContent;
                    copyBtn.textContent = 'Copied!';
                    copyBtn.classList.add('copied');
                    setTimeout(function() {
                        copyBtn.textContent = originalText;
                        copyBtn.classList.remove('copied');
                    }, 2000);
                });
            }

            syncToggleLabel(currentTheme());

            if (toggle) {
                toggle.addEventListener('click', function() {
                    setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
                });
            }

            prefersDark.addEventListener('change', function(event) {
                if (!localStorage.getItem('theme')) {
                    root.setAttribute('data-theme', event.matches ? 'dark' : 'light');
                    syncToggleLabel(currentTheme());
                    renderMermaid();
                }
            });

            if (copyBtn) {
                copyBtn.addEventListener('click', copyEmail);
            }

            if (emailAddress) {
                emailAddress.addEventListener('click', copyEmail);
            }

            renderMermaid();
        })();
    </script>
</body>
</html>
